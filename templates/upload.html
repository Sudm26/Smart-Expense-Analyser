{% extends "base.html" %}
{% block content %}<div class="row justify-content-center"><div class="col-md-8"><h1 class="h2">Upload a receipt</h1><p class="text-muted">The system will run OCR, extract fields, and use ML to suggest a category.</p><form class="card card-body shadow-sm" method="post" enctype="multipart/form-data"><label class="form-label" for="receipt">Receipt image</label><input class="form-control mb-3" id="receipt" name="receipt" type="file" accept="image/png,image/jpeg,image/webp" required><button class="btn btn-primary">Analyze receipt</button></form><p class="small text-muted mt-3">Supported: PNG, JPG, JPEG, WEBP. You can correct every generated value before saving.</p></div></div>{% endblock %}
